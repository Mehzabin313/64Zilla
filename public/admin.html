<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>64Zilla.com</title>

<link rel="stylesheet" href="css/admin.css">

<link rel="stylesheet" href="css/seller-dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>ADMIN</h2>

    <button onclick="loadSection('users')">Users</button>
    <button onclick="loadSection('sellers')">Sellers</button>
    <button onclick="loadSection('products')">Products</button>
    <button onclick="loadSection('orders')">Orders</button>
</div>

<!-- MAIN -->
<div class="main">

    <!-- STATS -->
    <div class="stats">
        <div>Users: <span id="totalUsers">0</span></div>
        <div>Sellers: <span id="totalSellers">0</span></div>
        <div>Products: <span id="totalProducts">0</span></div>
        <div>Orders: <span id="totalOrders">0</span></div>
    </div>

    <!-- CONTENT -->
    <div id="content">Loading...</div>

    <!-- CHART -->
    <canvas id="chart"></canvas>

</div>

<script src="js/admin.js"></script>

</body>
</html>
