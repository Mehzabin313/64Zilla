<!DOCTYPE html>
<html>
<head>
  <title>bKash Payment</title>
</head>
<body>

<h2>bKash Payment Verification</h2>

<p>Send Money to: 01XXXXXXXXX</p>

<input id="trxId" placeholder="Transaction ID"><br><br>
<input id="bkashNumber" placeholder="Your bKash Number"><br><br>

<button onclick="submitPayment()">Submit</button>

<script>
const BASE_URL = "https://six4zilla.onrender.com";

async function submitPayment() {

  const order = JSON.parse(localStorage.getItem("pendingOrder"));

  if (!order) {
    alert("No pending order found");
    return;
  }

  const trxId = document.getElementById("trxId").value;
  const bkashNumber = document.getElementById("bkashNumber").value;

  if (!trxId || !bkashNumber) {
    alert("Fill all fields");
    return;
  }

  const payload = {
    order,
    status: "SUCCESS",
    transactionId: trxId,
    bkashNumber
  };

  try {
    const res = await fetch(`${BASE_URL}/verify-payment`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (data.success) {
      alert("Payment submitted successfully!");
      localStorage.removeItem("pendingOrder");
      location.href = "home.html";
    } else {
      alert("Payment failed!");
    }

  } catch (err) {
    console.log(err);
    alert("Server error");
  }
}
</script>

</body>
</html>
