<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile - 64Zilla</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f2f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.profile-card {
    width: 380px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    color: #2e7d32;
}

.info p {
    background: #f5f5f5;
    padding: 10px;
    border-radius: 6px;
    margin: 8px 0;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    background: #43a047;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #2e7d32;
}

.logout {
    background: #e53935;
}

.logout:hover {
    background: #c62828;
}
</style>
</head>

<body>

<div class="profile-card">

    <h2>User Profile</h2>

    <div class="info">
        <p><b>Email:</b> <span id="email">Loading...</span></p>
        <p><b>Role:</b> <span id="role">Loading...</span></p>
    </div>

    <hr>

    <h3>Change Password</h3>

    <input type="password" id="oldPassword" placeholder="Old Password">
    <input type="password" id="newPassword" placeholder="New Password">

    <button onclick="changePassword()">Update Password</button>

    <button class="logout" id="logoutBtn">Logout</button>

</div>

<script>
const BASE_URL = "https://six4zilla.onrender.com";

/* ================= LOAD PROFILE (JWT FIXED) ================= */
async function loadProfile() {
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
        return;
    }

    try {
        const res = await fetch(`${BASE_URL}/me`, {
            method: "GET",
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        const data = await res.json();

        if (!data.success) {
            localStorage.removeItem("token");
            window.location.href = "login.html";
            return;
        }

        document.getElementById("email").innerText = data.user.email;
        document.getElementById("role").innerText = data.user.role;

    } catch (err) {
        console.log(err);
        window.location.href = "login.html";
    }
}

loadProfile();

/* ================= CHANGE PASSWORD ================= */
async function changePassword() {

    const oldPassword = document.getElementById("oldPassword").value;
    const newPassword = document.getElementById("newPassword").value;

    if (!oldPassword || !newPassword) {
        alert("Fill both fields");
        return;
    }

    const token = localStorage.getItem("token");

    const res = await fetch(`${BASE_URL}/change-password`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
            oldPassword,
            newPassword
        })
    });

    const data = await res.json();

    if (data.success) {
        alert("Password updated");
        document.getElementById("oldPassword").value = "";
        document.getElementById("newPassword").value = "";
    } else {
        alert(data.message || "Failed");
    }
}

/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    window.location.href = "login.html";
});
</script>

</body>
</html>
