<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>

  <!-- Bootstrap OK -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/product_container.css">
  <link rel="stylesheet" href="css/discount-sale.css">
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/tangail.css">

  <style>
    :root {
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --green-light: #E1F5EE;
      --red-light: #FAECE7;
      --red-text: #993C1D;
      --border: #e0e0e0;
      --text-muted: #888;
    }

    * { box-sizing: border-box; }

    body {
      background: #f8f9fa;
      color: #222;
    }

    /* ⚠️ Navbar CSS commented out (not issue but unused) */
  </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="nav">
  <div class="logo">
    <h4>64Zilla!</h4>
  </div>

  <div class="navmenu">

    <div class="menu-toggle" id="mobile-menu">
      <i class="fa-solid fa-bars"></i>

      <!-- ❌ PROBLEM: FontAwesome CDN missing in head -->
      <!-- RESULT: icon may not show -->
    </div>

    <ul class="navul">
      <li><a href="home.html">HOME</a></li>
      <li><a href="#main">SHOP</a></li>
      <li><a href="contact.html">CONTACT</a></li>
      <li><a href="faq.html">FAQ</a></li>
      <li><a href="seller-register.html">SELLER</a></li>
      <li><a href="profile.html">PROFILE</a></li>
    </ul>

    <div class="navbtn">
      <button type="button" id="login-btn">LOGIN</button>
    </div>

  </div>
</div>

<!-- ================= MAIN WRAPPER ================= -->
<div class="home-page">

  <div class="nav2">

    <div class="menu">
      <button id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      <!-- ❌ same FontAwesome issue -->
    </div>

    <!-- SIDEBAR -->
    <div id="sideMenu" class="side-menu">

      <!-- ⚠️ OK -->
      <div class="side-header">
        <div>
          <h3>MENU</h3>
          <p id="sb-name"></p>
        </div>
        <span onclick="closeMenu()">×</span>
      </div>

      <hr>

      <a href="home.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="orders.html">Orders</a>
      <a href="cart.html">Cart</a>
      <a href="contact.html">Contact</a>
      <a href="faq.html">FAQ</a>

      <hr>

      <a href="#" onclick="logout()">Logout</a>
    </div>

    <div id="menuOverlay" class="menu-overlay" onclick="closeMenu()"></div>

    <!-- SEARCH -->
    <div class="search">
      <input type="text" id="search" placeholder="Search">
      <button id="searchBtn">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <!-- CART -->
    <div class="cart" id="cartdiv">
      <button id="cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
      </button>
    </div>

  </div>

  <!-- ================= PRODUCT DETAIL ================= -->
  <div class="detail-wrapper">

    <!-- LOADING -->
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Loading product...</p>

      <!-- ❌ ISSUE POSSIBILITY:
           JS fetch fail হলে এইটা forever থাকবে -->
    </div>

    <!-- PRODUCT CARD -->
    <div class="detail-card" id="detailCard" style="display:none;">

      <!-- LEFT IMAGE -->
      <div>
        <div class="main-img-wrap">
          <img id="mainProductImg" src="" />

          <!-- ❌ ISSUE:
               image URL null হলে broken image দেখাবে -->
        </div>

        <div class="thumb-row" id="thumbRow"></div>
      </div>

      <!-- RIGHT INFO -->
      <div>

        <div class="shop-badge">
          <span class="shop-dot"></span>
          <span id="shopName">Loading...</span>
        </div>

        <h1 id="productName">—</h1>
        <p id="productSubtitle">—</p>

        <div class="price-row">
          <span id="productPrice">৳ 0</span>
          <span id="productOldPrice" style="display:none;"></span>
          <span id="discountBadge" style="display:none;"></span>
        </div>

        <hr>

        <table>
          <tr><td>Weight</td><td id="productWeight">—</td></tr>
          <tr><td>District</td><td id="productDistrict">—</td></tr>
          <tr><td>Category</td><td id="productCategory">—</td></tr>
          <tr><td>Stock</td><td id="productStock">—</td></tr>
        </table>

        <hr>

        <!-- QTY -->
        <div class="qty-section">
          <button onclick="changeQty(-1)">−</button>
          <span id="qtyDisplay">1</span>
          <button onclick="changeQty(1)">+</button>
        </div>

        <button onclick="addToCart()">Add to Cart</button>
        <button onclick="buyNow()">Buy Now</button>

        <!-- DELIVERY -->
        <div class="delivery-info">
          Delivery in 1 day
        </div>

        <div class="desc-box">
          <p id="productDesc">—</p>
        </div>

      </div>
    </div>
  </div>

</div>

<!-- RELATED -->
<div class="related-section" id="relatedSection" style="display:none;">
  <div id="relatedGrid"></div>
</div>

<!-- TOAST -->
<div class="toast-wrap">
  <div class="toast-msg" id="toastMsg"></div>
</div>

<!-- ================= JS ================= -->
<script src="js/product-detail.js"></script>
<script src="js/product.js"></script>
<script src="js/discount-sale.js"></script>
<script src="js/store.js"></script>
<script src="js/container2.js"></script>
<script src="js/add-product.js"></script>
<script src="js/container.js"></script>
<script src="js/search.js"></script>

<!-- ❌ MAIN POSSIBLE BUG AREA:
     product-detail.js এর ভিতরে fetch ভুল থাকলে
     "Server থেকে data সমস্যা" আসবে -->

</body>
</html>
