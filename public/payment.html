<!DOCTYPE html>
<html>
<head>
  <title>64Zilla.com - Payment</title>
</head>
<body>

<h2>Payment Page</h2>
<p>Click confirm to complete your payment</p>

<button id="payBtn" onclick="confirmPayment()">Confirm Payment</button>

<script>
const BASE_URL = "https://six4zilla.onrender.com";

async function confirmPayment() {

  const btn = document.getElementById("payBtn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  try {
    const order = JSON.parse(localStorage.getItem("pendingOrder"));

    if (!order) {
      alert("No pending order found!");
      btn.disabled = false;
      btn.innerText = "Confirm Payment";
      return;
    }

    const res = await fetch(`${BASE_URL}/orders`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(order)
    });

    const data = await res.json();

    if (data.success) {

      alert("Payment Successful & Order Placed!");

      localStorage.removeItem("cart");
      localStorage.removeItem("pendingOrder");

      window.location.href = "home.html";

    } else {
      alert("Payment Failed!");
      btn.disabled = false;
      btn.innerText = "Confirm Payment";
    }

  } catch (err) {
    console.log("PAYMENT ERROR:", err);
    alert("Network Error!");

    btn.disabled = false;
    btn.innerText = "Confirm Payment";
  }
}
</script>

</body>
</html>
